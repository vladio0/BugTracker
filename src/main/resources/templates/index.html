<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bug-tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Bug-tracker</h1>

        <form th:action="@{/add}" th:object="${newBug}" method="post" class="mb-3">
            <input type="text" class="form-control mb-2"
                   th:field="*{title}" placeholder="Bug title">

            <input type="date" class="form-control mb-2"
                   th:field="*{date}">

            <input type="text" class="form-control mb-2"
                   th:field="*{devName}" placeholder="Developer name">

            <select class="form-control mb-2" th:field="*{status}">
                <option value="OPEN">Open</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="FIXED">Fixed</option>
                <option value="CLOSED">Closed</option>
            </select>
            <select class="form-control mb-2" th:field="*{priority}">
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
                <option value="CRITICAL">Critical</option>
            </select>

            <select class="form-control mb-2" th:field="*{category}">
                <option value="UI">UI</option>
                <option value="FRONTEND">Frontend</option>
                <option value="BACKEND">Backend</option>
                <option value="SECURITY">Security</option>
            </select>
            <div class="input-group">
                <button class="btn btn-primary" type="submit">Add</button>
            </div>
 </form>

        <form th:action="@{/removeAll}" method="post" class="text-center mb-4">
            <button class="btn btn-danger" type="submit">Delete All Bugs</button>
        </form>

        <form th:action="@{/search}" method="post" class="mb-3">
            <div class="input-group">
                <input type="text" class="form-control" name="searchTerm" placeholder="Search Bugs" th:value="${searchTerm}">
                <button class="btn btn-outline-secondary" type="submit">Search</button>
            </div>
        </form>

 <ul class="list-group">
     <li th:each="item : ${allBugs}" class="list-group-item">

         <b th:text="${item.title}"></b><br>

         Date: <span th:text="${item.date}"></span><br>
         Developer: <span th:text="${item.devName}"></span><br>
         Status: <span th:text="${item.status}"></span><br>
         Priority: <span th:text="${item.priority}"></span><br>
         Category: <span th:text="${item.category}"></span>

         <form th:action="@{/delete/{id}(id=${item.id})}" method="post" class="mt-2">
             <button type="submit" class="btn btn-danger btn-sm">Delete</button>
         </form>

     </li>
 </ul>

    </div>
</body>
</html>
